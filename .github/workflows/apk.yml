name: APK oluştur

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: İmza anahtarını kontrol et
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 adlı gizli anahtar (secret) eklenmemiş. Repo > Settings > Secrets and variables > Actions kısmından ekleyin."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Paketleri kur
        run: npm ci || npm install

      - name: Android projesini oluştur
        run: |
          ./scripts/prepare-www.sh
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          VERSION="1.0.${{ github.run_number }}"
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${VERSION}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: APK'yı imzala
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > ks.p12
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks ks.p12 --ks-type PKCS12 --ks-pass pass:okumagunlugum --ks-key-alias okumagunlugum --out OkumaGunlugum.apk aligned.apk
          "$BT/apksigner" verify OkumaGunlugum.apk
          rm -f ks.p12

      - name: Sürümü yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Okuma Günlüğüm ${{ env.VERSION }}
          body: |
            Tablete kurmak için aşağıdaki **OkumaGunlugum.apk** dosyasını indirip aç.
            Önceki sürüm kuruluysa üstüne kurulur, kayıtların silinmez.

            Değişiklik: ${{ github.event.head_commit.message }}
          files: OkumaGunlugum.apk
          make_latest: true
